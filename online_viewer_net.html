        #githubimg {
            border-radius: 11.5px;
            width: 125px;
            height: 125px;
            border: 2px solid green;
            transition: transform 0.2s ease;
        }

        #githubimg:hover {
            transform: scale(1.05);

            margin-bottom: 10px;

            max-width: 600px;
            line-height: 1.4;

        .lang-icons {

        #repos-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
            padding: 10px;
        }

        .repo-card {
            background: #141414;
            border: 2px solid #008000;
            border-radius: 8px;
            padding: 16px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            border-color: #33ff33;
            box-shadow: 0 6px 16px rgba(51, 255, 51, 0.25);
        }

        .repo-name {
            color: #33ff33;
            font-size: 1.6rem;
            text-decoration: none;
            word-break: break-word;
        }

        .repo-name:hover {
            text-decoration: underline;
        }

        .repo-desc {
            color: #cccccc;
            font-size: 1.15rem;
            margin: 10px 0 15px 0;
            flex-grow: 1;
        }

        .repo-meta {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: #888888;
            border-top: 1px dashed #333333;
            padding-top: 8px;
        }

        .repo-lang {
            color: #f5de19;
        }

        .status-msg {
            font-size: 1.4rem;
            color: #888888;
        }
    </style>

        <h2 class="section-title">> Repositories</h2>
        <div id="repos-container">
            <span class="status-msg">Loading repositories...</span>
        </div>
    </center>

    <script>
        const username = "fete3712-vmX";
        const container = document.getElementById("repos-container");

        async function loadRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                
                if (!response.ok) {
                    throw new Error(`Status ${response.status}`);
                }

                const repos = await response.json();
                container.innerHTML = "";

                if (repos.length === 0) {
                    container.innerHTML = `<span class="status-msg">No public repositories found.</span>`;
                    return;
                }

                repos.forEach(repo => {
                    const card = document.createElement("div");
                    card.className = "repo-card";

                    const desc = repo.description ? repo.description : "No description provided.";
                    const lang = repo.language ? repo.language : "Plain Text";

                    card.innerHTML = `
                        <div>
                            <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
                            <p class="repo-desc">${desc}</p>
                        </div>
                        <div class="repo-meta">
                            <span class="repo-lang">&#9679; ${lang}</span>
                            <span>&#9733; ${repo.stargazers_count} | &#9094; ${repo.forks_count}</span>
                        </div>
                        <a href="${repo.html_url}">Visit</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<span class="status-msg">Failed to load repositories. <a href="https://github.com/${username}" target="_blank" style="color: #33ff33;">View on GitHub</a></span>`;
            }
        }

        loadRepos();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FETE3712-VMX // TERMINAL_PORTFOLIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #33ff66;
      --phosphor-dim: #136629;
      --phosphor-bright: #80ff9e;
      --screen-bg: #050d06;
      --glow-spread: 0 0 10px rgba(51, 255, 102, 0.45);
      --font-body: 'Share Tech Mono', monospace;
      --font-display: 'VT323', monospace;
    }

    body.amber-mode {
      --phosphor: #ffb000;
      --phosphor-dim: #704400;
      --phosphor-bright: #ffd166;
      --screen-bg: #100800;
      --glow-spread: 0 0 10px rgba(255, 176, 0, 0.45);
    }

    body.cyber-mode {
      --phosphor: #00f0ff;
      --phosphor-dim: #00565b;
      --phosphor-bright: #a6f9ff;
      --screen-bg: #000c10;
      --glow-spread: 0 0 10px rgba(0, 240, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #000000;
      color: var(--phosphor);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .crt-monitor {
      width: 100%;
      max-width: 1100px;
      height: 94vh;
      background: #121314;
      border-radius: 28px;
      padding: 16px 16px 24px 16px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.95),
        inset 0 0 15px rgba(255, 255, 255, 0.05),
        inset 0 2px 2px rgba(255, 255, 255, 0.15);
      border: 3px solid #1e2022;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .crt-screen {
      flex: 1;
      background-color: var(--screen-bg);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.95);
      border: 2px solid #000;
    }

    /* Scanlines */
    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.4) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 3px 100%;
      z-index: 50;
      pointer-events: none;
    }

    /* Vignette */
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.85) 100%);
      z-index: 51;
      pointer-events: none;
    }

    .crt-inner-glow {
      position: absolute;
      inset: 0;
      z-index: 49;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255, 255, 255, 0.02) 50%,
        transparent 100%
      );
      background-size: 100% 30px;
      animation: roll 10s linear infinite, flicker 0.12s infinite alternate;
    }

    @keyframes roll {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes flicker {
      0% { opacity: 0.97; }
      100% { opacity: 1; }
    }

    .content-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      z-index: 10;
      text-shadow: var(--glow-spread);
      scroll-behavior: smooth;
    }

    .content-viewport::-webkit-scrollbar {
      width: 8px;
    }
    .content-viewport::-webkit-scrollbar-thumb {
      background: var(--phosphor-dim);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--phosphor-dim);
      padding-bottom: 12px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--phosphor);
      border-radius: 50%;
      box-shadow: var(--glow-spread);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      border-bottom: 1px dashed var(--phosphor-dim);
      padding-bottom: 16px;
    }

    .nav-btn {
      color: var(--phosphor);
      text-decoration: none;
      border: 1px solid var(--phosphor-dim);
      padding: 6px 14px;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      background: rgba(0, 0, 0, 0.3);
    }

    .nav-btn:hover {
      background: var(--phosphor);
      color: var(--screen-bg);
      text-shadow: none;
      box-shadow: var(--glow-spread);
    }

    .hero {
      margin-bottom: 40px;
    }

    .ascii-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 0.95;
      margin-bottom: 16px;
      letter-spacing: 2px;
      color: var(--phosphor-bright);
    }

    .hero-tagline {
      font-size: 1.1rem;
      max-width: 680px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .badge-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.8rem;
      border: 1px solid var(--phosphor);
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.03);
    }

    .sec-head {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin: 32px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sec-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--phosphor-dim);
    }

    /* GITHUB DYNAMIC REPOS GRID */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .project-card {
      border: 1px solid var(--phosphor-dim);
      padding: 16px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.1s;
    }

    .project-card:hover {
      border-color: var(--phosphor);
      transform: translateY(-2px);
    }

    .project-card h3 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: var(--phosphor-bright);
      word-break: break-word;
    }

    .project-card p {
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--phosphor);
      opacity: 0.85;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-top: 1px dashed var(--phosphor-dim);
      padding-top: 10px;
    }

    .repo-stats {
      display: flex;
      gap: 12px;
      color: var(--phosphor-dim);
    }

    .project-link {
      color: var(--phosphor);
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid var(--phosphor-dim);
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.5);
    }

    .project-link:hover {
      background: var(--phosphor);
      color: var(--screen-bg);
      text-shadow: none;
    }

    /* Terminal Loader */
    #loadingStatus {
      font-size: 1.1rem;
      color: var(--phosphor-bright);
      padding: 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Bezel Bottom */
    .hardware-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 8px;
    }

    .brand-stamp {
      font-family: sans-serif;
      font-size: 0.75rem;
      font-weight: 900;
      color: #383b40;
      letter-spacing: 2px;
    }

    .knob-cluster {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .theme-btn {
      background: #242629;
      color: #7e8590;
      border: 1px solid #32353a;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: var(--font-body);
    }

    .theme-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="crt-monitor">
    
    <div class="crt-screen">
      <div class="crt-inner-glow"></div>

      <div class="content-viewport" id="scrollContainer">
        
        <!-- Status Bar -->
        <div class="status-bar">
          <div class="status-indicator">
            <span class="dot"></span>
            <span>NODE: FETE3712-VMX // ONLINE</span>
          </div>
          <div>BAUD: 14400bps | <span id="clock">00:00:00</span></div>
        </div>

        <!-- Navigation -->
        <nav>
          <a href="#about" class="nav-btn sound-trigger">[ 01. IDENTITY ]</a>
          <a href="#projects" class="nav-btn sound-trigger">[ 02. GITHUB_REPOS ]</a>
          <a href="https://github.com/fete3712-vmX" target="_blank" class="nav-btn sound-trigger">&gt; GITHUB_PROFILE ↗</a>
        </nav>

        <!-- Hero -->
        <section id="about" class="hero">
          <div class="ascii-title">
            &gt; FETE3712-VMX
          </div>
          <p class="hero-tagline">
            Just a Developer.
          </p>
          <div class="badge-bar">
            <span class="badge">HOST: GITHUB_API</span>
            <span class="badge">USER: fete3712-vmX</span>
            <span class="badge">STATUS: LINKED</span>
          </div>
        </section>

        <!-- Repositories Section -->
        <div class="sec-head" id="projects">[ REPO_DATABASE ]</div>
        
        <div id="loadingStatus">
          <span>&gt; QUERYING GITHUB API FOR /users/fete3712-vmX/repos ...</span>
        </div>

        <section class="project-grid" id="repoGrid"></section>

      </div>
    </div>

    <!-- Bezel Controls -->
    <div class="hardware-controls">
      <div class="brand-stamp">VMX-DECK // TERMINAL SYSTEM</div>
      <div class="knob-cluster">
        <button class="theme-btn" onclick="setTheme('')">GREEN</button>
        <button class="theme-btn" onclick="setTheme('amber-mode')">AMBER</button>
        <button class="theme-btn" onclick="setTheme('cyber-mode')">CYBER</button>
      </div>
    </div>

  </div>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Theme Switcher
    function setTheme(themeClass) {
      document.body.className = themeClass;
      playBeep(880, 0.05);
    }

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 520, duration = 0.03) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function attachSoundListeners() {
      document.querySelectorAll('.sound-trigger, a, button').forEach(el => {
        el.onmouseenter = () => playBeep(750, 0.02);
        el.onclick = () => playBeep(450, 0.04);
      });
    }
    attachSoundListeners();

    // Fetch GitHub Repositories for fete3712-vmX
    async function fetchGitHubRepos() {
      const username = 'fete3712-vmX';
      const statusEl = document.getElementById('loadingStatus');
      const gridEl = document.getElementById('repoGrid');

      try {
        const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=30`);
        
        if (!response.ok) {
          throw new Error(`HTTP_${response.status}: Unable to reach node.`);
        }

        const repos = await response.json();
        statusEl.style.display = 'none';

        if (repos.length === 0) {
          gridEl.innerHTML = `<div style="grid-column: 1/-1;">&gt; NO PUBLIC REPOSITORIES FOUND ON NODE [${username}].</div>`;
          return;
        }

        gridEl.innerHTML = '';
        repos.forEach((repo, idx) => {
          const indexNum = String(idx + 1).padStart(2, '0');
          const description = repo.description || 'No system documentation / description provided.';
          const lang = repo.language || 'DATA/RAW';
          const stars = repo.stargazers_count;
          const forks = repo.forks_count;

          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <div>
              <h3>// ${indexNum}. ${escapeHTML(repo.name)}</h3>
              <p>${escapeHTML(description)}</p>
            </div>
            <div class="card-footer">
              <div class="repo-stats">
                <span>[${escapeHTML(lang)}]</span>
                <span>★ ${stars}</span>
                <span>⑂ ${forks}</span>
              </div>
              <a href="${repo.html_url}" target="_blank" class="project-link sound-trigger">&gt; VIEW_REPO</a>
            </div>
          `;
          gridEl.appendChild(card);
        });

        attachSoundListeners();

      } catch (err) {
        statusEl.innerHTML = `&gt; ERROR: [${err.message}] // FALLBACK: <a href="https://github.com/${username}" target="_blank" style="color:var(--phosphor);">&gt; OPEN DIRECT PROFILE</a>`;
      }
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    fetchGitHubRepos();
  </script>
</body>
</html>
